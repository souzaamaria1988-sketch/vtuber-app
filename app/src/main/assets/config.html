<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>VTuber Config</title></head>
<body>

  <vtuber-config
      scale="0.9"
      crop-top="0.5"
      idle-interval="400"
      volume-threshold="1500"
      talk-frames="3"
      silence-frames="8"
      anchor="bottom-center"
      position-x="0.5"
      position-y="1.0" />

  <vtuber-images>
    <image state="idle1"   src="images/idle1.png" />
    <image state="idle2"   src="images/idle2.png" />
    <image state="talking" src="images/talking.png" />
  </vtuber-images>

</body>
</html>
