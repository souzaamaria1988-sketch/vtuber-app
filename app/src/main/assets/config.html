<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>VTuber Config</title></head>
<body>

  <vtuber-config
      scale="1.0"
      crop-top="0.55"
      idle-interval="400"
      volume-threshold="400"
      talk-frames="2"
      silence-frames="6"
      anchor="bottom-center" />

  <vtuber-images>
    <image state="idle1"   src="images/idle1.png" />
    <image state="idle2"   src="images/idle2.png" />
    <image state="talking" src="images/talking.png" />
  </vtuber-images>

</body>
</html>
